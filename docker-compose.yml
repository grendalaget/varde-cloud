services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: varde
      POSTGRES_PASSWORD: varde
      POSTGRES_DB: varde
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varde -d varde"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
